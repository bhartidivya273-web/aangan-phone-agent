<rect x="174.0" y="125.0" width="172" height="78" rx="9" fill="#dfe3fb" stroke="#3b4fd8" stroke-width="1.6"/><text x="260.0" y="160.5" text-anchor="middle" font-size="10.8" fill="#1f2937">Rings the studio number,</text><text x="260.0" y="175.5" text-anchor="middle" font-size="10.8" fill="#1f2937">any hour, any day</text>
<rect x="364.0" y="229.0" width="172" height="78" rx="9" fill="#d6e6fc" stroke="#2563eb" stroke-width="1.6"/><text x="450.0" y="257.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Vaani answers 24/7, speaks</text><text x="450.0" y="272.0" text-anchor="middle" font-size="10.8" fill="#1f2937">and listens (English/Hinglish);</text><text x="450.0" y="287.0" text-anchor="middle" font-size="10.8" fill="#1f2937">sends a call-ended report</text>
<rect x="554.0" y="333.0" width="172" height="78" rx="9" fill="#d8f5e0" stroke="#16a34a" stroke-width="1.6"/><text x="640.0" y="361.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Business rules in editable</text><text x="640.0" y="376.0" text-anchor="middle" font-size="10.8" fill="#1f2937">files: services, rubric,</text><text x="640.0" y="391.0" text-anchor="middle" font-size="10.8" fill="#1f2937">outcomes, approved price line</text>
<rect x="744.0" y="437.0" width="172" height="78" rx="9" fill="#fdecb8" stroke="#d97706" stroke-width="1.6"/><text x="830.0" y="465.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Classifies the call: 5 criteria</text><text x="830.0" y="480.0" text-anchor="middle" font-size="10.8" fill="#1f2937">-&gt; 1 of 10 outcomes, flags,</text><text x="830.0" y="495.0" text-anchor="middle" font-size="10.8" fill="#1f2937">fields. Code guards the rules</text>
<rect x="934.0" y="541.0" width="172" height="78" rx="9" fill="#fadcea" stroke="#db2777" stroke-width="1.6"/><text x="1020.0" y="569.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Asks one question at a time,</text><text x="1020.0" y="584.0" text-anchor="middle" font-size="10.8" fill="#1f2937">price -&gt; approved line only,</text><text x="1020.0" y="599.0" text-anchor="middle" font-size="10.8" fill="#1f2937">calls the slot + booking tools</text>
<rect x="744.0" y="645.0" width="172" height="78" rx="9" fill="#d3f0f1" stroke="#0f9aa0" stroke-width="1.6"/><text x="830.0" y="673.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Real free slots; books the</text><text x="830.0" y="688.0" text-anchor="middle" font-size="10.8" fill="#1f2937">consultation and blocks</text><text x="830.0" y="703.0" text-anchor="middle" font-size="10.8" fill="#1f2937">the studio calendar</text>
<rect x="1124.0" y="749.0" width="172" height="78" rx="9" fill="#eceff3" stroke="#4b5563" stroke-width="1.6"/><text x="1210.0" y="777.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Every call, outcome, cost</text><text x="1210.0" y="792.0" text-anchor="middle" font-size="10.8" fill="#1f2937">and claim status; dashboard</text><text x="1210.0" y="807.0" text-anchor="middle" font-size="10.8" fill="#1f2937">with 9 panels (public view)</text>
<rect x="1124.0" y="853.0" width="172" height="78" rx="9" fill="#fde4cc" stroke="#ea580c" stroke-width="1.6"/><text x="1210.0" y="881.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Telegram note; designer claims</text><text x="1210.0" y="896.0" text-anchor="middle" font-size="10.8" fill="#1f2937">HubSpot contact + note: founder</text><text x="1210.0" y="911.0" text-anchor="middle" font-size="10.8" fill="#1f2937">Alerts to Nikhil when needed</text>
<text x="30" y="974" font-size="10.8" fill="#4b5563">Guardrails in code (with tests): no price, range or multiple is ever spoken; no promised times except a slot the booking tool returned; AI is disclosed in the greeting;</text>
<text x="30" y="991" font-size="10.8" fill="#4b5563">declined and escalated calls are never deleted; qualified leads are never lost (a missing caller number still produces the note). Stack: Vaani · Gemini · Cal.com · Supabase · Telegram · HubSpot · Next.js on Vercel.</text>
